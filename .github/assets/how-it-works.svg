<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b8fe0"/></marker>
  </defs>
  <rect width="1280" height="300" rx="14" fill="#11151b"/>
  <g font-size="15" fill="#8b95a3">
    <g transform="translate(40 60)">
      <rect width="330" height="180" rx="8" fill="#1b2633" stroke="#2c323d"/>
      <text x="24" y="40" fill="#7fbadc" font-size="13" font-weight="600" letter-spacing="2">1 · ON EACH HOST</text>
      <text x="24" y="78" fill="#f4f6f8" font-size="26" font-weight="700">signal.exe</text>
      <text x="24" y="110">Read-only Windows live-response</text>
      <text x="24" y="132">survey. Runs in about a minute.</text>
      <text x="24" y="154">Nothing installed, nothing changed.</text>
    </g>
    <path d="M384 150H468" stroke="#3b8fe0" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(475 60)">
      <rect width="330" height="180" rx="8" fill="#1b2633" stroke="#2c323d"/>
      <text x="24" y="40" fill="#7fbadc" font-size="13" font-weight="600" letter-spacing="2">2 · ONE FILE PER HOST</text>
      <text x="24" y="78" fill="#f4f6f8" font-size="26" font-weight="700">JSON run</text>
      <text x="24" y="110">Signals raised by the rules, the</text>
      <text x="24" y="132">evidence behind them, and what the</text>
      <text x="24" y="154">host could not show.</text>
    </g>
    <path d="M819 150H903" stroke="#3b8fe0" stroke-width="3" marker-end="url(#a)"/>
    <g transform="translate(910 60)">
      <rect width="330" height="180" rx="8" fill="#1b2633" stroke="#3b8fe0"/>
      <text x="24" y="40" fill="#86efac" font-size="13" font-weight="600" letter-spacing="2">3 · THIS REPOSITORY</text>
      <text x="24" y="78" fill="#f4f6f8" font-size="26" font-weight="700">Signal Console</text>
      <text x="24" y="110">All hosts together: triage, entities,</text>
      <text x="24" y="132">timeline, ATT&amp;CK coverage, what</text>
      <text x="24" y="154">is common and what is rare.</text>
    </g>
  </g>
</svg>
